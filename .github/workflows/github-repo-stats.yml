name: github-repo-stats

on:
  schedule:
    # Run this once per day, towards the end of the day for keeping the most
    # recent data point most meaningful (hours are interpreted in UTC).
    - cron: "0 23 * * *"
  workflow_dispatch: # Allow for running this manually.

jobs:
  github-repo-stats:
    runs-on: gh-larger-linux-mini
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Get GitHub token from pp-octo-sts.cf.platform.mckinsey.cloud
        uses: McK-Internal/octo-sts-action@v1
        id: octo-sts
        with:
          domain: pp-octo-sts.cf.platform.mckinsey.cloud
          scope: ${{ github.repository }}
          identity: vizro-repo-stats
      - name: Run GitHub repo stats
        # Use latest release.
        uses: jgehrcke/github-repo-stats@RELEASE
        with:
          ghtoken: ${{ steps.octo-sts.outputs.token }}
