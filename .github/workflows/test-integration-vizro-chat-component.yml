name: integration vizro_chat_component tests

defaults:
  run:
    working-directory: vizro-experimental

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  PYTHONUNBUFFERED: 1
  FORCE_COLOR: 1

jobs:
  test-integration-vizro-chat-component:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:latest
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - name: Install Hatch
        run: pip install hatch
      - name: Install Playwright browser
        run: hatch run playwright install chromium
      - name: Run tests
        run: |
          hatch run test-integration-vizro-chat-component
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_API_BASE }}

      - name: Create artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: http-requests-artifacts
          path: |
            vizro-experimental/*.png
