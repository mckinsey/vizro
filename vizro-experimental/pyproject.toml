[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {name = "Vizro Team"}
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15"
]
dependencies = [
  "vizro>=1.0.0",
  # Temporary: vizro pulls flask-caching transitively, but vizro-experimental installs vizro from PyPI (which still
  # allows 2.5.0), so cap it directly here too. flask-caching 2.5.0 emits a spurious NullCache warning.
  # Remove once flask-caching 2.5 is adopted. See flask 2.5 investigation issue.
  "flask-caching>=2,<2.5",
  "dash-extensions>=1.0.0",
  "dash-iconify>=0.1.2"
]
description = "Experimental Vizro features in incubation, including a chat component and floating chat popup."
dynamic = ["version"]
license-files = {paths = ["LICENSE.txt"]}
name = "vizro-experimental"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
# Needed to use add_chat_popup() with the default auto-agent.
agent = [
  "pydantic-ai>=1.89.1"
]
# Only needed to run the demo apps under examples/.
examples = [
  "python-dotenv>=0.21.0",
  "openai",
  "anthropic>=0.18.0",
  "vizro-ai>=0.4.0",
  "openpyxl"
]

[tool.coverage.paths]
vizro = ["src/vizro_experimental"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:"
]
fail_under = 0
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["vizro_experimental"]

[tool.hatch.build.targets.wheel]
artifacts = ["src/vizro_experimental/static/**/*"]
packages = ["src/vizro_experimental"]

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "-m",
  "not benchmark and not integration_browser and not integration_llm"
]
filterwarnings = [
  "error",
  # Selenium 4.2.0 (pinned by dash[testing]'s selenium<=4.2.0 cap) requires urllib3[secure], which
  # forces urllib3 1.26.x and installs the urllib3-secure-extra marker, making urllib3 warn on import.
  "ignore:'urllib3\\[secure\\]' extra is deprecated:DeprecationWarning",
  # dash.testing.plugin registers an old-style hookimpl (pytest.mark.tryfirst) that pytest 9 flags
  # as PytestRemovedIn10Warning during plugin load. Third-party plugin issue, not ours; match by
  # message so it stays robust across pytest versions (the warning category is pytest-9-only).
  "ignore:The hookimpl",
  # Python 3.13's deprecation of asyncio.get_event_loop() trips PydanticAI's
  # sync streaming helper (it catches RuntimeError but not the DeprecationWarning).
  # The fallback path still creates a fresh loop correctly; only the warning is noise.
  "ignore:There is no current event loop:DeprecationWarning:pydantic_ai"
]
markers = [
  "benchmark: agent perf/quality suite (on-demand)",
  "integration_browser: Playwright browser tests; require Chromium and a self-hosted example app subprocess",
  "integration_llm: LLM-judge tests; require OPENAI_API_KEY and self-host the example app subprocess"
]
pythonpath = ["src"]

[tool.ruff]
extend = "../pyproject.toml"
src = ["src"]
