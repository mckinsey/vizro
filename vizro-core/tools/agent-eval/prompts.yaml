# Vizro docs agent eval - vibe-coding prompts.
#
# These prompts describe user *goals*, not Vizro implementations. The model
# is instructed (via the system prompt) to attempt each one in Vizro using
# only the docs, and to emit an explicit giveup marker if it can't. Prompts
# should be phrased the way a data-savvy but framework-agnostic user would
# actually type them.
#
# Ids are stable. When adding new prompts, append (do not renumber).
# Group tags let you slice results by capability area.

version: 2

prompts:
  # ---- Basic setup ------------------------------------------------------
  - id: P01
    group: basic
    prompt: |
      I have the plotly express tips dataset. Build me a one-page dashboard
      that shows how the size of the bill relates to the size of the tip.
    intent:
      - dashboard has exactly one page
      - page contains a visualization relating total_bill to tip

  - id: P02
    group: basic
    prompt: |
      Build me a two-page dashboard for the plotly express tips dataset. One
      page should show a chart of the data. The other page should let me
      browse the underlying rows in a table. Add some sort of navigation so
      I can flip between them.
    intent:
      - dashboard has two pages
      - one page shows a chart of tips
      - the other page shows the tips rows in a table
      - navigation lets the user switch between pages

  - id: P03
    group: config
    prompt: |
      My colleague isn't a Python developer but she needs to be able to
      tweak our dashboard config. Set things up so the dashboard lives in a
      YAML file she can edit, using a simple histogram of the iris dataset
      as an example.
    intent:
      - dashboard configuration lives in a YAML file (not entirely in Python)
      - a Python entry point loads the YAML and wires the data
      - histogram of iris data is present

  # ---- Controls ---------------------------------------------------------
  - id: P04
    group: controls
    prompt: |
      I have a time-series dataset with a date column and two related
      metrics I'd like to plot as line charts. Let a user narrow the view
      to a chosen date range, and make it so I can share a URL of a
      particular filtered view with a colleague.
    intent:
      - two line charts share a date axis
      - a control on the page lets the user restrict the view to a date range
      - the chosen range is reflected in the URL so the view is bookmarkable

  - id: P05
    group: controls
    prompt: |
      I have two scatter charts on one page. Let the user pick which
      column is on the x-axis of both charts at once, from a small fixed
      list of options.
    intent:
      - a single control on the page changes the x-axis of both charts together
      - the control offers a fixed list of column options
      - both charts update when the control changes

  - id: P06
    group: controls
    prompt: |
      One of my columns is numeric with hundreds of unique values. Let a
      user focus on the middle chunk of the range using some sort of
      slider.
    intent:
      - a slider control on the page filters by a numeric column
      - the control lets the user pick a range (not a single value)
      - the default range covers roughly the middle 80% of the data

  # ---- Actions and interactions -----------------------------------------
  - id: P07
    group: actions
    prompt: |
      Add a button to my dashboard that lets me download whatever is
      currently on screen as a CSV file.
    intent:
      - a button on the page indicates export or download
      - clicking it downloads the currently visible/filtered data as CSV
      - implemented using Vizro's built-in mechanism, not a hand-rolled callback

  - id: P08
    group: actions
    prompt: |
      I want clicking on a bar in one of my charts to filter a table on the
      same page down to just the rows for that category. No custom code if
      Vizro has a built-in way.
    intent:
      - a bar chart and a table share a page
      - clicking a bar filters the table down to matching rows
      - the built-in Vizro cross-filter mechanism is used, not a custom callback

  - id: P09
    group: actions
    prompt: |
      Add a button that, when clicked, updates a card on the page to show
      the current UTC time in ISO 8601 format.
    intent:
      - a button and a card appear on the same page
      - clicking the button updates the card to show a current UTC timestamp
      - the update is wired through Vizro's action/callback mechanism

  - id: P10
    group: actions
    prompt: |
      Selecting a row in a table on my page should filter a chart next to
      it, using the value in one of the row's columns as the filter.
    intent:
      - a table and a chart appear on the same page
      - selecting a row filters the chart by a specified column of that row
      - built-in Vizro cross-filter mechanism is used, not a custom callback

  # ---- Layouts and composition ------------------------------------------
  - id: P11
    group: layout
    prompt: |
      Two summary number cards on top, one big chart filling the width
      underneath.
    intent:
      - two summary/KPI-style cards sit side by side on the top row
      - a chart spans the full width on the row below

  - id: P12
    group: layout
    prompt: |
      Three charts arranged side by side that wrap to a new row when the
      screen is narrow.
    intent:
      - three charts share the same page
      - they lay out in a horizontally-flowing row that wraps on narrow screens

  - id: P13
    group: layout
    prompt: |
      Group two related charts inside a titled, bordered section on my
      page. Add a filter that only affects the charts inside that section.
    intent:
      - two charts are grouped into a distinct visible container with a title
      - a filter appears inside that container
      - the filter only affects charts inside the container, not others on the page

  # ---- Components -------------------------------------------------------
  - id: P14
    group: components
    prompt: |
      Show me the average total bill from the tips dataset as a big number
      at the top of the page, formatted as US dollars.
    intent:
      - a prominent number shows the mean of total_bill
      - the number is formatted with a dollar sign and two decimals
      - implemented via Vizro's built-in KPI/figure pattern rather than raw markdown

  - id: P15
    group: components
    prompt: |
      On one page, let me flip between a histogram of bill size and a
      histogram of tip size using tabs.
    intent:
      - the page has a tabbed layout with two tabs
      - one tab shows a histogram of total_bill; the other a histogram of tip

  # ---- Custom extensions ------------------------------------------------
  - id: P16
    group: custom
    prompt: |
      I want to plot the average tip by weekday but I want full control
      over the plot styling. Show me the pattern for writing my own chart
      function that Vizro will use.
    intent:
      - a custom chart function is defined and used in a page
      - the function is registered via Vizro's decorator / capture mechanism
      - its first argument accepts a data frame

  - id: P17
    group: custom
    prompt: |
      I want a text component that always prepends a fixed prefix to
      whatever text I give it. Show me the recommended pattern for
      extending Vizro with my own component type.
    intent:
      - a custom component class extending an appropriate Vizro base is defined
      - Vizro is told how to accept this new component type inside a page
      - the component is used in a page

  # ---- Theming and polish -----------------------------------------------
  - id: P18
    group: theming
    prompt: |
      Set my dashboard to dark mode, add my logo image in the header, and
      add a helpful tooltip on the main chart's title explaining what it
      shows.
    intent:
      - the dashboard is themed dark
      - a logo image is loaded from the assets folder
      - the main chart has a tooltip / description on its title
