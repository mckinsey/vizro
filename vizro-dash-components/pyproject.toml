[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-nodejs-version>=0.3.2"]

[project]
authors = [
  {name = "Vizro Team"}
]
classifiers = [
  "Framework :: Dash",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15"
]
dependencies = [
  "dash>=4,<5",
  "dash-mantine-components>=2.0.0"
]
description = "Vizro Dash Components are used by the Vizro framework but can be used in a pure Dash app"
dynamic = ["version"]
license-files = {paths = ["LICENSE.txt"]}
name = "vizro-dash-components"
readme = "README.md"
requires-python = ">=3.11"

[project.urls]
Source = "https://github.com/mckinsey/vizro"

[tool.hatch.version]
source = "nodejs"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = [
  "error",
  # Selenium's internal use of deprecated urllib3 API.
  "ignore:HTTPResponse.getheader:DeprecationWarning",
  # Selenium 4.2.0 (pinned by dash[testing]'s selenium<=4.2.0 cap) requires urllib3[secure], which
  # forces urllib3 1.26.x and installs the urllib3-secure-extra marker, making urllib3 warn on import.
  "ignore:'urllib3\\[secure\\]' extra is deprecated:DeprecationWarning"
]
